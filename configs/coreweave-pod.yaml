apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snowball-trex-workspace
spec:
  accessModes: [ReadWriteMany]
  storageClassName: shared-vast
  resources:
    requests:
      storage: 600Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: snowball-trex-pilot
  labels:
    app: snowball-trex-pilot
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 43200
  nodeSelector:
    gpu.nvidia.com/class: H100_NVLINK_80GB
  tolerations:
    - key: is_gpu
      operator: Equal
      value: 'true'
      effect: PreferNoSchedule
  containers:
    - name: research
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
      command: [bash, -lc, 'sleep infinity']
      resources:
        requests:
          cpu: '32'
          memory: 320Gi
          nvidia.com/gpu: '4'
        limits:
          cpu: '64'
          memory: 480Gi
          nvidia.com/gpu: '4'
      volumeMounts:
        - {name: workspace, mountPath: /work}
        - {name: shm, mountPath: /dev/shm}
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: snowball-trex-workspace
    - name: shm
      emptyDir: {medium: Memory, sizeLimit: 32Gi}
